name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Triggered solo su tag tipo v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false  # Se un OS fallisce, gli altri continuano
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: linux
          - os: windows-latest
            artifact_name: windows
          - os: macos-latest       
            artifact_name: macos

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Checkout del codice
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Dipendenze di sistema per Linux (GTK, WebKit, ecc.)
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # 3. Setup Rust (richiesto da Tauri)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. Cache Rust per velocizzare le build successive
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 5. Estrai la versione dal tag (es. v1.2.3 → 1.2.3)
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # 6. Aggiorna la versione in tauri.conf.json con quella del tag
      - name: Sync version in tauri.conf.json
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          if [ -f src-tauri/tauri.conf.json ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          fi
      - name: Install npm dependencies
        run: npm install
      # 7. Build e packaging con Tauri
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Release ${{ github.ref_name }}
          releaseBody: |
            ## Download

            | Piattaforma | File                         |
            |-------------|------------------------------|
            | Windows     | .msi o .exe (setup)          |
            | Linux       | .AppImage o .deb             |
            | macOS       | .dmg (Intel / Apple Silicon) |
            

            Vedi i file allegati qui sotto per scaricare la versione per il tuo sistema.
          releaseDraft: false
          prerelease: false
          # Adatta questo path alla tua cartella frontend:
          # distPath: src          # se il frontend e' in /src
          # frontendDist: public   # se il frontend e' in /public